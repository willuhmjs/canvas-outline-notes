services:
  davis:
    image: ghcr.io/tchapi/davis-standalone:latest
    environment:
      APP_ENV: prod
      DATABASE_DRIVER: pgsql
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: davis
      DATABASE_USER: davis
      DATABASE_PASSWORD: ${DAVIS_DB_PASSWORD}
      ADMIN_LOGIN: ${DAV_USERNAME}
      ADMIN_PASSWORD: ${DAV_PASSWORD}
      AUTH_REALM: ${DAV_CALENDAR_DISPLAYNAME:-Academics}
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: davis
      POSTGRES_USER: davis
      POSTGRES_PASSWORD: ${DAVIS_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "davis"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  canvas-notes:
    image: ghcr.io/willuhmjs/canvas-outline-notes:latest
    environment:
      # Canvas
      CANVAS_ICS_URL: ${CANVAS_ICS_URL}
      CANVAS_BASE_URL: ${CANVAS_BASE_URL:-https://canvas.odu.edu}
      # CalDAV (Davis)
      DAV_BASE_URL: http://davis:9000
      DAV_USERNAME: ${DAV_USERNAME}
      DAV_PASSWORD: ${DAV_PASSWORD}
      DAV_CALENDAR_DISPLAYNAME: ${DAV_CALENDAR_DISPLAYNAME:-Academics}
      # Outline (optional — omit to disable AI notes)
      OUTLINE_BASE_URL: ${OUTLINE_BASE_URL:-}
      OUTLINE_API_TOKEN: ${OUTLINE_API_TOKEN:-}
      OUTLINE_COLLECTION_NAME: ${OUTLINE_COLLECTION_NAME:-Automatic Notes}
      # LLM (required for AI notes)
      CHAT_API_BASE_URL: ${CHAT_API_BASE_URL:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL_TEXT: ${CHAT_MODEL_TEXT:-gpt-4o-mini}
      CHAT_MODEL_VISION: ${CHAT_MODEL_VISION:-gpt-4o}
      # Schedule (minutes)
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
      NOTES_INTERVAL_MINUTES: ${NOTES_INTERVAL_MINUTES:-60}
      # State + token file (shared volume)
      STATE_FILE: /data/state.json
      TOKEN_FILE: /data/token.json
      # Optional: trust an extra CA (e.g. a self-signed intercepting proxy)
      # without disabling verification for everything else. Leave unset for
      # normal deployments — see README for details.
      EXTRA_CA_CERT_FILE: ${EXTRA_CA_CERT_FILE:-}
    volumes:
      - canvas_data:/data
      # - ./extra-ca.pem:/extra-ca.pem:ro  # mount alongside EXTRA_CA_CERT_FILE=/extra-ca.pem
    depends_on:
      - davis
    restart: unless-stopped

  management:
    image: ghcr.io/willuhmjs/canvas-outline-notes-management:latest
    environment:
      TOKEN_FILE: /data/token.json
      SETTINGS_FILE: /data/settings.json
      PORT: "3000"
      # OIDC login (required) — register this app with your identity provider
      # using redirect URI https://<host>/auth/callback/oidc
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER}
      AUTH_OIDC_ID: ${AUTH_OIDC_ID}
      AUTH_OIDC_SECRET: ${AUTH_OIDC_SECRET}
      # Optional: comma-separated list of groups (from the ID token's `groups`
      # claim) allowed to log in. Leave unset to allow any authenticated user.
      ALLOWED_GROUPS: ${ALLOWED_GROUPS:-}
      # Required if running behind a reverse proxy (Traefik, nginx, Caddy, etc.) or on
      # any non-localhost URL: the public URL this app is served at. Without it, SvelteKit
      # can't validate the Origin header on login form POSTs and rejects them as cross-site.
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      # Optional: path to an extra CA cert (PEM) to trust, e.g. if your OIDC provider uses
      # a self-signed/internal cert. Mount the cert file alongside this. Leave unset for
      # normal setups — Node's default trust store is used as-is.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
    ports:
      - "3000:3000"
    volumes:
      - canvas_data:/data
      # - ./extra-ca.pem:/extra-ca.pem:ro  # mount alongside NODE_EXTRA_CA_CERTS=/extra-ca.pem
    restart: unless-stopped

volumes:
  postgres_data:
  canvas_data:
