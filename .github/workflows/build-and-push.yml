name: Build and push

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild to pick up base image security patches
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # Disable provenance and SBOM attestations to avoid wrapping the image
          # in an OCI image index — the cluster's registry:2 pull-through cache
          # sends incorrect Accept headers during re-validation of OCI indexes,
          # causing containerd to fail to pull even previously-cached images.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
