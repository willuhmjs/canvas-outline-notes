apiVersion: batch/v1
kind: CronJob
metadata:
  name: canvas-sync
  namespace: dav
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: canvas-notes
          restartPolicy: Never
          containers:
          - name: sync
            image: ghcr.io/willuhmjs/canvas-outline-notes:latest
            command: ["python3", "/app/sync.py"]
            envFrom:
            - configMapRef:
                name: canvas-config
                optional: true
            - secretRef:
                name: canvas-sync-secrets
            - secretRef:
                name: canvas-outline-secrets
                optional: true
            env:
            - name: DAV_BASE_URL
              value: "http://davis.dav.svc.cluster.local:9000"
            - name: DAV_CALENDAR_DISPLAYNAME
              value: "Academics"
            - name: CANVAS_BASE_URL
              value: "https://canvas.odu.edu"
            - name: STATE_FILE
              value: "/data/state.json"
            - name: TOKEN_FILE
              value: "/data/token.json"
            volumeMounts:
            - name: data
              mountPath: /data
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: canvas-notes-data
