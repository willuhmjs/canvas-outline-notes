# Generates AI study notes for new Canvas assignments and lecture files into Outline
# under Automatic Notes / <Class> / Assignments|Notes / <Name>. Hourly -- LLM calls
# and file downloads are heavy, doesn't need finer freshness than that.
#
# Uses a custom image (ghcr.io/willuhmjs/canvas-outline-notes) with PyMuPDF,
# python-docx, and python-pptx pre-installed so pip doesn't run at job start.
# Image source: https://github.com/willuhmjs/canvas-outline-notes
apiVersion: batch/v1
kind: CronJob
metadata:
  name: canvas-outline-notes
  namespace: dav
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Raised from 600s: with MAX_NEW_PER_RUN no longer an artificial throttle, a run needs
      # room to actually clear the queue (LLM calls are the slow part, several seconds each).
      # Schedule is hourly with concurrencyPolicy: Forbid, so 30 min still leaves a safe
      # margin before the next scheduled run.
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: canvas-outline-notes
              image: ghcr.io/willuhmjs/canvas-outline-notes:sha-2465e71
              imagePullPolicy: IfNotPresent
              env:
                # Without this, Python fully buffers stdout when it's not a TTY (i.e.
                # always, in a container), so `kubectl logs` on a running job shows
                # nothing until the buffer fills or the process exits -- confirmed live.
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: CANVAS_BASE_URL
                  value: "https://canvas.odu.edu"
                - name: CHAT_API_BASE_URL
                  value: "https://chat.cs.odu.edu/api/v1"
                - name: CHAT_MODEL_TEXT
                  value: "gpt-oss-120b"
                - name: CHAT_MODEL_VISION
                  value: "gemma-4-31b"
                - name: OUTLINE_BASE_URL
                  value: "https://outline.will.net"
                - name: OUTLINE_COLLECTION_NAME
                  value: "Automatic Notes"
                - name: CANVAS_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: canvas-sync-secrets
                      key: CANVAS_API_TOKEN
                - name: CHAT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: canvas-outline-secrets
                      key: CHAT_API_KEY
                - name: OUTLINE_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: canvas-outline-secrets
                      key: OUTLINE_API_TOKEN
                # For raise_credential_alarm/resolve_credential_alarm only -- same
                # Academics calendar and creds canvas-sync already uses.
                - name: DAV_BASE_URL
                  value: "http://davis.dav.svc.cluster.local:9000"
                - name: DAV_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: canvas-sync-secrets
                      key: DAV_USERNAME
                - name: DAV_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: canvas-sync-secrets
                      key: DAV_PASSWORD
              resources:
                limits:
                  memory: 512Mi
                requests:
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: ca-cert
                  mountPath: /ca-cert
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: canvas-outline-script
            - name: ca-cert
              configMap:
                name: homelab-ca-cert
