apiVersion: batch/v1
kind: CronJob
metadata:
  name: canvas-notes
  namespace: dav
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: canvas-notes
          restartPolicy: Never
          containers:
          - name: notes
            image: ghcr.io/willuhmjs/canvas-outline-notes:latest
            command: ["python3", "/app/notes.py"]
            envFrom:
            - secretRef:
                name: canvas-sync-secrets
            - secretRef:
                name: canvas-outline-secrets
            env:
            - name: DAV_BASE_URL
              value: "http://davis.dav.svc.cluster.local:9000"
            - name: DAV_CALENDAR_DISPLAYNAME
              value: "Academics"
            - name: CANVAS_BASE_URL
              value: "https://canvas.odu.edu"
            - name: CHAT_API_BASE_URL
              value: "https://chat.cs.odu.edu/api/v1"
            - name: CHAT_MODEL_TEXT
              value: "gpt-oss-120b"
            - name: CHAT_MODEL_VISION
              value: "gemma-4-31b"
            - name: OUTLINE_BASE_URL
              value: "https://outline.will.net"
            - name: OUTLINE_COLLECTION_NAME
              value: "Automatic Notes"
            - name: STATE_FILE
              value: "/data/state.json"
            - name: TOKEN_FILE
              value: "/data/token.json"
            volumeMounts:
            - name: data
              mountPath: /data
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: canvas-notes-data
