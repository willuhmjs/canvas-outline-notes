# ServiceAccount and RBAC for canvas-outline-notes to persist incremental sync state
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canvas-outline-notes
  namespace: dav
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canvas-notes-state
  namespace: dav
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["canvas-notes-state"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canvas-notes-state
  namespace: dav
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canvas-notes-state
subjects:
- kind: ServiceAccount
  name: canvas-outline-notes
  namespace: dav
